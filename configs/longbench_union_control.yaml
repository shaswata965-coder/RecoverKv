# CONTROL for the distinct-window-union result (plan §12.4).
#
# `scripts/digest_union.py` measured that only ~42% of the 439 int2 windows are
# EVER selected during an eviction epoch (union 184 of 439, consistent across all
# 32 layers). That invites the conclusion "N_q is oversized, keep ~184". But there
# are two explanations and they point opposite ways:
#
#   (a) the digest found a genuinely sparse working set -> the gate is doing work;
#   (b) the BUDGET was simply too generous -> a smaller cache_budget would have
#       been just as good, and the digest revealed a tuning error, not a mechanism.
#
# This config tests (b) directly. It shrinks Tier 2 to the measured union size
# while holding the fp tier EXACTLY fixed, so the only variable is how many int2
# windows are retained:
#
#     current (longbench_digest_off):  budget 0.200, q 0.70 -> top_k_fp 48, N_q 439
#     this control:                    budget 0.126, q 0.49 -> top_k_fp 48, N_q 181
#
# ...at 59% of the evictable bytes (5.28 MB -> 3.10 MB). NO GATE — this is the
# ungated baseline at a smaller budget.
#
# Reading the result against off=47.47 (N_q=439) and k25=48.37 (N_q=439, gated):
#
#   score ~= 47.47  -> the tier was oversized. Just lower the budget; the digest
#                      adds nothing a cheaper config would not have given, and the
#                      union finding is about budget tuning, not about the method.
#   score <<  47.47  -> the 439 windows DO matter cumulatively even though only
#                      ~184 are touched per epoch, so the tier cannot be shrunk
#                      and the gate's per-step selection is doing real work.
_base_: base.yaml

run:
  mode: longbench
  seed: 42

model:
  name: /home/ee/phd/eez228470/llama-3.1-8b-instruct
  revision: main
  dtype: float16
  attn_implementation: flash_attention_2

cache:
  backend: windowed
  backend_package: flash_attn
  cache_budget: 0.126        # <- the ONLY knobs that differ from digest_off
  window_size: 8
  num_sink_tokens: 5
  local_window_size: 128
  quant_ratio: 0.49          # <- chosen so top_k_fp stays 48 and N_q lands ~181
  quant_budget_mode: bytes
  first_eviction_step: 0

window:
  window_size: 8
  num_sink_tokens: 5
  local_window_size: 128

telemetry:
  track_scores: false

longbench:
  datasets:
     - 2wikimqa
  include_chinese: false
  use_e_variants: false
  max_length: null
  num_samples: 200
  output_dir: outputs/longbench/union_control
  seed: 42
  resume: false
  skip_oom: false
  aggressive_cache_clear: false
