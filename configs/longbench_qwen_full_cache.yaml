# ============================================================================
# LongBench — Qwen2.5-7B-Instruct (YaRN 128K) Full Cache Baseline
# ============================================================================
# The Qwen2.5 column's baseline, on the same protocol as the "ours" rows and as
# the QEvict column (int2_qwen): bf16, YaRN 32K -> 128K, no truncation. It used
# to be fp16 at native 32K truncated to 31500, i.e. a different model setup from
# the rows it is the baseline for -- see QWEN_PORT_PLAN.md "Round 3".
#
# Produces: outputs/longbench/qwen_full_cache/
_base_: base.yaml

run:
  mode: longbench
  seed: 42

model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: main
  dtype: bfloat16
  attn_implementation: flash_attention_2
  # QEvict's Qwen protocol: bf16 (Qwen2.5's released dtype; fp16 overflows at
  # long context) and YaRN 32K -> 128K, as every int2_qwen Qwen config runs.
  # See configs/longbench_qwen_ours_flash_attn.yaml for why each key matters.
  max_position_embeddings: 131072
  rope_scaling:
    rope_type: yarn
    factor: 4.0
    original_max_position_embeddings: 32768
  sliding_window: 131072
  use_sliding_window: false

cache:
  backend: dynamic                      # transformers.DynamicCache, no eviction
  backend_package: null
  cache_budget: null

telemetry:
  track_scores: false

longbench:
  datasets:
    - narrativeqa
    - qasper
    - multifieldqa_en
    - hotpotqa
    - 2wikimqa
    - musique
    - gov_report
    - qmsum
    - multi_news
    - trec
    - triviaqa
    - samsum
    - passage_count
    - passage_retrieval_en
    - lcc
    - repobench-p
  include_chinese: false
  use_e_variants: false
  max_length: null                      # YaRN's 131072 window fits every prompt: no truncation
  output_dir: outputs/longbench/qwen_full_cache
  seed: 42
  resume: false
  skip_oom: true                        # baseline: record OOM'd examples as pred=null
  aggressive_cache_clear: false
