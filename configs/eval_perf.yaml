# ============================================================================
# StickyKV — Performance Benchmarks (Suite C)
# ============================================================================
_base_: base.yaml

run:
  mode: perf
  seed: 42

model:
  name: meta-llama/Meta-Llama-3-8B-Instruct
  revision: main
  dtype: float16

window:
  window_size: 32
  num_sink_tokens: 4
  local_window_size: 256

perf:
  # NOTE on the windowed_eager_* rows below. Until the output_attentions gate was
  # fixed in perf_runner.py, these cells ran with scoring DISABLED (the eager hook
  # needs output_attentions=True to see attn_weights) and so timed sink+local
  # eviction, not this project's scored eviction. They are correct now, and
  # correspondingly slower and far more memory-hungry: output_attentions
  # materializes [B, H, L, L], which is ~4 GB per layer in fp16 at prefill 8192.
  # Any windowed_eager number recorded before that fix is not comparable to one
  # recorded after it, and eager rows are never comparable to flash rows.
  configs:
    # --- eager backend (always available; Kaggle-safe) ---
    - name: baseline_eager
      cache_backend: dynamic
      attn_implementation: eager
    - name: baseline_eager_with_hook
      cache_backend: dynamic
      attn_implementation: eager
      install_hooks_for_measurement: true
    - name: windowed_eager_50pct
      cache_backend: windowed
      cache_package: eager
      attn_implementation: eager
      cache_budget: 0.50
    - name: windowed_eager_25pct
      cache_backend: windowed
      cache_package: eager
      attn_implementation: eager
      cache_budget: 0.25
    - name: windowed_eager_10pct
      cache_backend: windowed
      cache_package: eager
      attn_implementation: eager
      cache_budget: 0.10
    # --- flash_attn backend (Ampere+ with flash-attn-2) ---
    - name: baseline_flash_attn
      cache_backend: dynamic
      attn_implementation: flash_attention_2
      requires_flash_attn: true
    - name: baseline_flash_attn_with_hook
      cache_backend: dynamic
      attn_implementation: flash_attention_2
      install_hooks_for_measurement: true
      requires_flash_attn: true
    - name: windowed_flash_50pct
      cache_backend: windowed
      cache_package: flash_attn
      attn_implementation: flash_attention_2
      cache_budget: 0.50
      requires_flash_attn: true
    - name: windowed_flash_25pct
      cache_backend: windowed
      cache_package: flash_attn
      attn_implementation: flash_attention_2
      cache_budget: 0.25
      requires_flash_attn: true
    - name: windowed_flash_10pct
      cache_backend: windowed
      cache_package: flash_attn
      attn_implementation: flash_attention_2
      cache_budget: 0.10
      requires_flash_attn: true

  # ChunkKV-identical (prefill, gen) grid — NeurIPS 2025, arXiv 2502.00299.
  # Same shape so direct comparison is possible; backend may be eager or
  # flash_attention_2 per-config (no FlashAttention required to run the grid).
  grid:
    - { prefill_len: 4096, gen_len: 1024 }
    - { prefill_len: 4096, gen_len: 4096 }
    - { prefill_len: 8192, gen_len: 1024 }
    - { prefill_len: 8192, gen_len: 4096 }
  # Method-independent and large: the full [B, L, V] prefill logits tensor is
  # ~1.05 GB per row in fp16 at prefill=4096, which swamps the very differences
  # a memory column exists to show. See eval_efficiency.yaml's note.
  prefill_logits: last_only

  num_warmup_runs: 2
  warmup_decode_steps: null            # auto: cross the first eviction
  num_measurement_runs: 10
  # GPU-state hygiene — without these, later cells run on a hotter, slower part
  # and a co-tenant process is indistinguishable from a slow method.
  cooldown_s: 3.0
  enable_clock_locking: true           # needs elevated perms; warns and continues
  clock_settle_s: 5.0
  allow_shared_gpu: false
  skip_if_oom: true
  skip_if_flash_attn_unavailable: true

telemetry:
  output_dir: outputs
