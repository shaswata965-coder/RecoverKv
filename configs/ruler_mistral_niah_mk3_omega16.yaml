# ============================================================================
# RULER 4096 — Mistral-7B-Instruct-v0.2, Ours, task=niah_multikey_3, omega=16
# ============================================================================
# Geometry identical to configs/ruler_niah_mk3_omega16.yaml (the Llama column)
# and configs/ruler_qwen_niah_mk3_omega16.yaml (the Qwen column), so the three
# differ only by model.
# Captures a utils/cache_memory.py byte-accounting report per example
# (ruler.capture_memory) so retained-bytes / compression-ratio can be read off
# directly, alongside the task's accuracy score.
# quant_ratio=0.5 is the two-tier fp16+int4 method this branch exists for. Run
# the single-tier fp16 ablation with --override cache.quant_ratio=0.0; the
# operating point is printed at the start of every run either way.
# Produces: outputs/ruler/mistral_4096_niah_mk3_omega16/
_base_: base.yaml

run:
  mode: ruler
  seed: 42

model:
  # v0.2 specifically. v0.1 sets sliding_window=4096; both the FA2 kernel and the
  # sdpa mask builder band attention by *cache-slot* distance, which stops
  # matching real token distance once the windowed cache compacts. v0.2/v0.3 set
  # sliding_window=null. The runner warns at load if this is ever violated.
  # RULER templates every task, so every prompt goes through encode_prompt —
  # Mistral HAS a BOS ("<s>"), so that is the add_special_tokens=False path.
  # 4096-token RULER sits well inside v0.2's 32K window, so no truncation knob
  # is needed here (unlike LongBench, which pins max_length=31500 for Mistral).
  name: mistralai/Mistral-7B-Instruct-v0.2
  revision: main
  dtype: float16
  attn_implementation: flash_attention_2     # MUST match cache.backend_package

cache:
  backend: windowed
  backend_package: flash_attn                # imports modules.windowed_cache
  cache_budget: 0.20                        # cache 20%
  window_size: 16                           # omega=16
  num_sink_tokens: 5
  local_window_size: 128                    # fixed tokens
  quant_ratio: 0.5                          # two-tier fp16+int4 split q in [0,1]; 0 = pure fp16
  rerotate_on_evict: false
  first_eviction_step: 0                    # compress the prompt before the 2nd token (default)

telemetry:
  track_scores: false                       # mandatory; see prompt 04 §1

ruler:
  # Override to wherever the RULER split is staged on the run host, e.g.
  #   --override ruler.data_dir=/path/to/defensivekv_dataset/ruler/4096
  data_dir: /home/ee/visitor/man_misn.visitor/kv_cache/DefensiveKV/defensivekv_dataset/ruler/4096
  tasks:
    - niah_multikey_3
  num_samples: max
  capture_memory: true                      # per-example utils/cache_memory.py report
  output_dir: outputs/ruler/mistral_4096_niah_mk3_omega16
  seed: 42
  resume: true
  skip_oom: false
  aggressive_cache_clear: false
