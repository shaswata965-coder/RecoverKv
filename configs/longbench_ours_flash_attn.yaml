# ============================================================================
# LongBench — Ours (flash-attn backend)
# ============================================================================
# Windowed KV-cache with flash-attention-2 score extraction.
# DefensiveKV headline: compression_ratio=0.8 (cache_budget=0.20).
# Produces: outputs/longbench/ours_flash_attn_compression_0.8/
_base_: base.yaml

run:
  mode: longbench
  seed: 42

model:
  name: /home/ee/visitor/man_misn.visitor/llama-3.1-8b-instruct
  revision: main
  dtype: float16
  attn_implementation: flash_attention_2     # MUST match cache.backend_package

cache:
  backend: windowed
  backend_package: flash_attn               # imports modules.windowed_cache
  cache_budget: 0.20                        # DefensiveKV's headline; compression_ratio = 0.8
  window_size: 8
  num_sink_tokens: 5
  local_window_size: 128                    # fixed tokens; ratio 0.25 exceeds cache_budget 0.20
  quant_ratio: 0.5                          # two-tier fp16+int4 split q in [0,1]; THE method here. Single-tier ablation: --override cache.quant_ratio=0.0
  first_eviction_step: 0                    # prompt compressed on decode step 0 (default); >0 leaves short answers at full cache


telemetry:
  track_scores: false                       # mandatory; see prompt 04 §1

longbench:
  datasets:
    # - narrativeqa
     #- qasper
     #- multifieldqa_en
    #  - hotpotqa
     - 2wikimqa
    #  - musique
    #  - gov_report
    #  - qmsum
    #  - multi_news
     #- trec
     #- triviaqa
     #- samsum
    #  - passage_count
    #  - passage_retrieval_en
     #- lcc
     #- repobench-p
  include_chinese: false
  use_e_variants: false
  max_length: null   # no pre-truncation — full context (Llama-3.1 128K fits all LongBench prompts). Matches DefensiveKV.
  output_dir: outputs/longbench/ours_flash_attn_compression_0.8
  seed: 42
  resume: false
  skip_oom: false
  aggressive_cache_clear: false
