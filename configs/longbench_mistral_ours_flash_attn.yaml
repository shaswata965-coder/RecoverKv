# ============================================================================
# LongBench — Mistral-7B-Instruct-v0.2, Ours (flash-attn backend)
# ============================================================================
# Windowed KV-cache with flash-attention-2 score extraction.
# DefensiveKV headline: compression_ratio=0.8 (cache_budget=0.20).
# Cache geometry is identical to configs/longbench_ours_flash_attn.yaml so the
# Mistral and Llama columns differ only by the model — same budget, same window,
# same two-tier split, same read gate.
# Produces: outputs/longbench/mistral_ours_flash_attn_compression_0.8/
_base_: base.yaml

run:
  mode: longbench
  seed: 42

model:
  # v0.2 specifically. v0.1 sets sliding_window=4096, which bands attention by
  # cache-SLOT distance once the windowed cache compacts — not comparable.
  # v0.2/v0.3 set sliding_window=null. A local checkout path works equally well,
  # but keep 'instruct' in the name: the chat-template gate reads the model name
  # (see LongBenchRunner._should_apply_chat_template), so a path without it
  # silently drops the [INST] wrapper.
  name: mistralai/Mistral-7B-Instruct-v0.2
  revision: main
  dtype: float16
  attn_implementation: flash_attention_2     # MUST match cache.backend_package

cache:
  # Pinned to utils.config.OPERATING_POINT -- the ONE point speed and quality
  # are both measured at. scripts/check_operating_point.py fails if this drifts.
  # Two-tier int2 with the rank-1 read gate is the shipped method; a single-tier
  # fp16 ablation is --override cache.quant_ratio=0.0.
  backend: windowed
  backend_package: flash_attn               # imports modules.windowed_cache
  cache_budget: 0.20                        # DefensiveKV's headline; compression_ratio = 0.8
  window_size: 8
  num_sink_tokens: 5
  local_window_size: 128                    # fixed tokens; ratio 0.25 exceeds cache_budget 0.20
  quant_ratio: 0.70  # two-tier int2 split q in [0,1]; 0 = pure fp16. q>0 needs window_size divisible by 4.
  # The mode a memory-vs-quality claim is stated in: q splits the BYTE budget,
  # so the retained cache costs exactly cache_budget of the full cache at every
  # q and cheaper int2 keys buy more context. Pinned, not inherited.
  quant_gate_ratio: 0.25            # read-gate selectivity (the gate IS the read path at q>0)
  quant_budget_mode: bytes
  first_eviction_step: 0                    # prompt compressed on decode step 0 (default); >0 leaves short answers at full cache

telemetry:
  track_scores: false                       # mandatory; see prompt 04 §1

longbench:
  datasets:
    - narrativeqa
    - qasper
    - multifieldqa_en
    - hotpotqa
    - 2wikimqa
    - musique
    - gov_report
    - qmsum
    - multi_news
    - trec
    - triviaqa
    - samsum
    - passage_count
    - passage_retrieval_en
    - lcc
    - repobench-p
  include_chinese: false
  use_e_variants: false
  # The published model2maxlen value for mistral-7B-instruct-v0.2 in the
  # THUDM/LongBench -> SnapKV -> AdaKV lineage. Reproduces those numbers
  # verbatim and leaves headroom inside the 32768 window for the longest
  # generation (gov_report/qmsum/multi_news at 512) plus the chat template.
  # Do NOT inherit Llama-3.1's `null`: on this 32K model that would feed prompts
  # past max_position_embeddings, where RoPE positions are out of distribution.
  max_length: 31500
  output_dir: outputs/longbench/mistral_ours_flash_attn_compression_0.8
  seed: 42
  resume: false
  skip_oom: false
  aggressive_cache_clear: false
