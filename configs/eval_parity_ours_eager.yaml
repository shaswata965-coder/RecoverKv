# ============================================================================
# StickyKV — Parity Ours (Eager Backend) — Kaggle-runnable
# ============================================================================
_base_: base.yaml

run:
  mode: parity_ours
  seed: 42

base_run_npz: outputs/parity_base_wikitext-103.npz

model:
  name: meta-llama/Meta-Llama-3-8B-Instruct
  revision: main
  dtype: float16
  attn_implementation: eager        # MUST pair with cache.backend_package: eager

cache:
  backend: windowed
  backend_package: eager            # imports modules.windowed_eager_cache
  cache_budget: 0.25
  window_size: 32
  num_sink_tokens: 4
  local_window_size: 256
  quant_ratio: 0.0                  # two-tier int4 split q in [0,1]; 0 = pure fp16. q>0 needs an even window_size (int4 nibble packing).

data:
  dataset: wikitext-103
  article_id: 0
  prefill_len: 2048
  gen_len: 1024

parity:
  dataset: wikitext-103
  num_articles: 50
  article_index: 0
  min_article_tokens: 4096
  prefill_len: 2048
  gen_len: 1024

window:
  window_size: 32
  num_sink_tokens: 4
  local_window_size: 256

telemetry:
  track_scores: true
  output_dir: outputs
