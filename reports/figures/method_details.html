<script>
/* Export without any on-page UI:  S = .svg,  P = .png (600 dpi),  Ctrl/Cmd+P = vector PDF. */
(function () {
  const svg = document.getElementById('figure');
  function save(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function svgText() {
    const c = svg.cloneNode(true);
    c.removeAttribute('style');
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(c);
  }
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 's') {
      save(new Blob([svgText()], {type: 'image/svg+xml'}), 'method_details.svg');
    } else if (k === 'p') {
      const img = new Image(), scale = 600 / 72;
      img.onload = () => {
        const cv = document.createElement('canvas');
        cv.width = Math.round(396 * scale); cv.height = Math.round(234 * scale);
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob((b) => save(b, 'method_details.png'), 'image/png');
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText());
    }
  });
})();
</script>
