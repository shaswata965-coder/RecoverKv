<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecoverKV Observations</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --base: #b9b7ae; --base2: #6f6e69; --seg0: #d6d4cc; --chip: #eef3fb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --base: #5f5e59; --base2: #a3a198; --seg0: #45443f; --chip: #1c2533;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --base: #5f5e59; --base2: #a3a198; --seg0: #45443f; --chip: #1c2533;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
header h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
header .sub { color: var(--ink2); margin: 0 0 16px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px;
  color: var(--ink2); background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 14px; }
.facts b { color: var(--ink); font-weight: 600; }
.key { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--ink2); margin: 0 0 14px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.sw.ours { background: var(--s1); } .sw.base { background: var(--base); }
.sw.ref { border: 1.5px solid var(--ink2); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
nav a { font-size: 13px; color: var(--ink); text-decoration: none; background: var(--chip);
  padding: 4px 10px; border-radius: 999px; }
button { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px;
  cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--s1); color: #fff; border-color: transparent; }
.spacer { flex: 1; }
.status { flex-basis: 100%; text-align: right; font-size: 12.5px; color: var(--ink2); min-height: 1em; }
section { margin-top: 36px; }
section > h2 { font-size: 21px; margin: 0 0 4px; }
section > .lede { color: var(--ink2); margin: 0 0 14px; font-size: 14px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px 14px; margin: 0 0 16px; }
.card h3 { font-size: 17px; line-height: 1.35; margin: 0 0 12px; font-weight: 600; }
.card h3 .nm { color: var(--s1); }
canvas.fig { display: block; width: 100%; }
.tbl { overflow-x: auto; }
.facts { grid-template-columns: max-content minmax(0, 1fr); overflow-wrap: anywhere; }
.card table { width: 100%; border-collapse: collapse; margin: 12px 0 8px; font-size: 13px;
  font-variant-numeric: tabular-nums; }
.card th, .card td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); }
.card th { color: var(--ink2); font-weight: 600; }
.card td:not(:first-child), .card th:not(:first-child) { text-align: right; }
.meaning { font-size: 13.5px; color: var(--ink2); margin: 6px 0 8px; }
.meaning b { color: var(--ink); }
.card ul { margin: 0 0 8px; padding-left: 20px; }
.card li { margin: 4px 0; font-size: 14px; }
.actions { display: flex; justify-content: flex-end; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-1); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12.5px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); display: none; white-space: pre; }
@media (max-width: 600px) { .card { padding: 14px 12px; } header h1 { font-size: 23px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RecoverKV: observations</h1>
    <p class="sub">Eviction, int2 storage with read cards, and the gated fused decode kernel, measured on one run and compared with fp16 eviction at the same memory.</p>
    <div class="facts" id="facts"></div>
    <div class="key">
      <span><span class="sw ours"></span>RecoverKV (measured on the run)</span>
      <span><span class="sw base"></span>Baseline, simulated on the same run's attention</span>
      <span><span class="sw ref"></span>Oracle or reference</span>
    </div>
    <div class="bar">
      <nav id="nav" class="bar"></nav>
      <span class="spacer"></span>
      <button id="theme" type="button">Theme: auto</button>
      <button id="exportAll" class="primary export" type="button">Export all (ZIP of PNGs)</button>
      <span id="status" class="status" aria-live="polite"></span>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="tip" role="tooltip"></div>
<script>
const RUN = {"model": "Llama-3.1-8B-Instruct", "data": "8 wikitext-103 test articles; 512-token prompt + 512 greedy decode steps each", "cache": "budget 20% (204 of 1,024 tokens/row); 5 sinks + 128-token local band; 2 fp16 + 26 int2 windows of 8 tokens; gate reads 7 of 26 per KV head", "gate": "read gate `gated` on 131,072 / 131,072 fused layer-steps", "tag": "RecoverKV \u00b7 wikitext \u00b7 ws 8 \u00b7 budget 0.20 \u00b7 gate 0.25 \u00b7 q 0.70"};
const SECTIONS = [{"id": "evict", "title": "Eviction", "lede": "What the two-tier eviction keeps, compared with fp16-only eviction holding the same bytes. Baselines are simulated on this run's own attention; the H2O-style one is given exact scores, which favours it.", "obs": [{"id": "skewed-importance", "name": "Skewed Importance", "claim": "Importance is broad, not peaked, so coverage wins: RecoverKV holds 1.8x the windows of fp16 eviction at the same bytes", "chart": {"type": "hbar", "unit": "%", "max": 100, "bars": [{"label": "Windows needed for 80% of importance", "value": 64.9, "kind": "ref"}, {"label": "Held by RecoverKV (fp + int2)", "value": 47.9, "kind": "ours"}, {"label": "Held by H2O-style fp16 eviction, same bytes", "value": 26.1, "kind": "base"}]}, "table": {"cols": ["measure", "value"], "rows": [["top 10% of windows hold", "22.4% of importance"], ["windows for 50% / 80% / 90% of importance", "32.2% / 64.9% / 79.4%"], ["windows held: RecoverKV", "44 (47.9% of existing)"], ["windows held: fp16 eviction, same bytes", "24 (26.1% of existing)"]]}, "meaning": "Importance = cumulative attention per 8-token window (Observation I). The top 10% of windows carry only 22%, so no small set holds it; 80% of it is spread over 65% of the windows. Keeping many windows cheaply beats keeping a few exactly, and int2 is what makes 44 windows affordable where fp16 affords 24."}, {"id": "missed-mass", "name": "Missed Mass", "claim": "At equal memory RecoverKV misses 35% less attention than fp16 eviction", "chart": {"type": "hbar", "unit": "%", "bars": [{"label": "RecoverKV (measured)", "value": 9.9, "kind": "ours"}, {"label": "H2O-style fp16 eviction, same bytes", "value": 15.2, "kind": "base"}, {"label": "StreamingLLM-style fp16, same bytes", "value": 15.6, "kind": "base"}, {"label": "Ceiling: best 28 windows re-picked every step", "value": 5.5, "kind": "ref"}]}, "table": {"cols": ["policy", "mean", "p90", "steps x heads missing >10%"], "rows": [["RecoverKV", "9.9%", "26.0%", "34.0%"], ["H2O-style fp16 eviction, same bytes", "15.2%", "39.6%", "47.1%"], ["StreamingLLM-style fp16, same bytes", "15.6%", "40.5%", "47.0%"], ["Ceiling (per-step best 28)", "5.5%", "13.9%", "17.1%"]]}, "meaning": "Share of each query's attention (full-KV attention of the same query) that falls on tokens no longer in memory; lower is better. RecoverKV also cuts the tail: 1 in 10 steps loses 26% or more, against 40% for fp16 eviction."}, {"id": "future-missed-mass", "name": "Future Missed Mass", "claim": "Holding the tail in int2 cuts the attention the next 32 steps lose by 37% at the same bytes", "chart": {"type": "hbar", "unit": "%", "bars": [{"label": "RecoverKV (fp + int2, measured)", "value": 28.9, "kind": "ours"}, {"label": "H2O-style fp16 eviction, same bytes", "value": 45.9, "kind": "base"}, {"label": "StreamingLLM-style fp16, same bytes", "value": 47.9, "kind": "base"}, {"label": "RecoverKV's fp tier alone (int2 dropped)", "value": 52.3, "kind": "base"}]}, "table": {"cols": ["horizon", "RecoverKV", "H2O-style, same bytes", "StreamingLLM-style, same bytes", "fp tier alone"], "rows": [["next 8 steps", "24.2%", "37.9%", "39.2%", "42.9%"], ["next 32 steps", "28.9%", "45.9%", "47.9%", "52.3%"], ["next 64 steps", "30.7%", "49.7%", "52.4%", "56.9%"]]}, "meaning": "At each eviction: of the attention the next H steps put on windows that already existed, the share on windows that eviction dropped (Observation II; sinks excluded, so it is a share of window attention). Lower means the decision kept what the future needs. Adding the int2 tier to the same fp tier removes 45% of it."}, {"id": "selection-churn", "name": "Selection Churn", "claim": "RecoverKV's retained set is 45% steadier than fp16 eviction, so each window is demoted and carded once", "chart": {"type": "hbar", "unit": "", "digits": 3, "bars": [{"label": "RecoverKV (fp + int2)", "value": 0.044, "kind": "ours"}, {"label": "fp16 eviction, same bytes (H2O- or StreamingLLM-style)", "value": 0.08, "kind": "base"}, {"label": "RecoverKV's fp tier alone", "value": 0.107, "kind": "base"}]}, "table": {"cols": ["measure", "value"], "rows": [["churn (Jaccard distance between consecutive retained sets)", "0.044 vs 0.08"], ["int2 windows still int2 at the next eviction", "99.6%"], ["windows moved per eviction per layer", "about 1"]]}, "meaning": "Jaccard distance between the retained sets of consecutive evictions (0 = unchanged). Low churn means demotion, card writes and promotions are rare, amortised work: the batched eviction moves about one window per layer per event."}, {"id": "prompt-retention", "name": "Prompt Retention", "claim": "The first eviction keeps the prompt windows the whole decode will lean on, at about twice the rate of recency", "chart": {"type": "hbar", "unit": "%", "max": 100, "bars": [{"label": "RecoverKV's kept prompt windows", "value": 76.0, "kind": "ours"}, {"label": "Most recent windows (recency)", "value": 39.1, "kind": "base"}]}, "table": {"cols": ["measure", "value"], "rows": [["kept set that is in the decode's most-attended set", "76.0% vs 39.1% for recency"], ["agreement with exact prompt-attention ranking", "100%"], ["prompt windows before / after the first eviction", "64 -> 28 evictable + 16 local"]]}, "meaning": "At decode step 1 the 512-token prompt is compressed. Overlap = share of the windows RecoverKV keeps that are among the 28 windows the full 512-step decode attends to most. The prompt's own attention predicts what the decode will need."}, {"id": "importance-revival", "name": "Historical Importance Revival", "claim": "Cold windows almost never come back, so evicting the int2 tail permanently is safe", "chart": {"type": "tiles", "tiles": [{"value": "0.2%", "label": "cold windows that revive within 8 evictions"}, {"value": "<0.1%", "label": "cold -> hot at the next eviction"}, {"value": "0.66x", "label": "future attention of windows evicted from int2, vs candidates"}]}, "table": {"cols": ["measure", "value"], "rows": [["episodes: 4 evictions outside the important set", "25,207"], ["revived within 8 evictions", "45 (0.2%)"], ["median time to revival", "3 evictions"]]}, "meaning": "Observation III: of windows outside the ground-truth important set for 4 consecutive evictions, the share that becomes important again within 8. Windows RecoverKV evicts from int2 draw a third less future attention than the average candidate."}, {"id": "tier-dynamics", "name": "Tier Dynamics", "claim": "Every tier move lands where future attention goes: promotions draw 2.34x the average, evictions 0.66x", "chart": {"type": "hbar", "unit": "x", "digits": 2, "refLine": {"value": 1.0, "label": "candidate average"}, "bars": [{"label": "int2 -> fp (promote)", "value": 2.34, "kind": "ours"}, {"label": "stay fp", "value": 1.63, "kind": "ours"}, {"label": "fp -> int2 (demote)", "value": 1.19, "kind": "ours"}, {"label": "stay int2", "value": 0.94, "kind": "ours"}, {"label": "int2 -> evicted", "value": 0.66, "kind": "ours"}]}, "table": {"cols": ["measure", "value"], "rows": [["promotions / demotions / evictions from int2", "221 / 221 / 1,336"], ["decision fidelity (fp set vs true ranking)", "94.5%"], ["eviction regret (future attention on evicted windows)", "0.2%"]]}, "meaning": "Observation V. Lift = a moved window's attention over the next 32 steps divided by the average of all windows that eviction decided on. Above 1 means the move went to a window the future needs: promotions pick the hottest windows and evictions the coldest (swap gain +1.15)."}]}, {"id": "quant", "title": "Quantization and card representation", "lede": "What two-bit storage and the per-window card preserve.", "obs": [{"id": "recovered-mass", "name": "Recovered Mass", "claim": "One fp16 window's bytes buy 3.8 int2 windows with their cards: 28 evictable windows where fp16 holds 8", "chart": {"type": "hbar", "unit": "", "digits": 0, "bars": [{"label": "RecoverKV: 2 fp16 + 26 int2 windows", "value": 28, "kind": "ours"}, {"label": "fp16 eviction at the same bytes", "value": 8, "kind": "base"}]}, "table": {"cols": ["measure", "fp16", "RecoverKV int2 + card"], "rows": [["bytes per 8-token window (K+V, 8 KV heads)", "32,768", "8,608 (card 2,176)"], ["evictable windows at a 20% budget", "8", "28"], ["missed mass, exact ranking (oracle)", "15.2%", "10.0%"], ["attention held in the int2 tier", "-", "7.3%"]]}, "meaning": "Bytes from the resolved cache geometry. Recovered mass: with the same ranking, the int2 tier turns 5.2 points of attention that fp16 eviction would lose into attention the cache still holds."}, {"id": "int2-fidelity", "name": "int2 Fidelity", "claim": "Keys survive two bits: attention over dequantized windows lands within 3.5% of full precision", "chart": {"type": "tiles", "tiles": [{"value": "11.8%", "label": "key reconstruction error (median)"}, {"value": "+3.5%", "label": "attention on read int2 windows vs truth"}, {"value": "+0.017", "label": "output error added by int2 storage"}]}, "table": {"cols": ["measure", "value"], "rows": [["K reconstruction error, median", "11.8%"], ["V reconstruction error, median", "55.0%"], ["output error: kept at fp16 -> kept at int2", "0.182 -> 0.199"]]}, "meaning": "Keys decide where attention goes, and they reconstruct to 12% error, so a dequantized window receives almost exactly the attention it should. Values are lossier (55%), but the int2 tier carries 7.3% of attention, so their measured effect on the output is +0.017."}, {"id": "card-ranking", "name": "Card Ranking", "claim": "A 272-byte card ranks int2 windows almost like exact attention", "chart": {"type": "hbar", "unit": "%", "max": 100, "bars": [{"label": "Card: hottest window in its top 7", "value": 96.4, "kind": "ours"}, {"label": "Random 7: hottest window included", "value": 26.9, "kind": "base"}, {"label": "Card: top 7 overlap with true top 7", "value": 81.0, "kind": "ours"}, {"label": "Random 7: overlap with true top 7", "value": 26.9, "kind": "base"}]}, "table": {"cols": ["measure", "card", "random pick"], "rows": [["Spearman rank correlation with true attention", "0.91", "0.00"], ["top-7 overlap with the true top 7", "81.0%", "26.9%"], ["hottest window in the top 7", "96.4%", "26.9%"], ["bytes per head", "272", "-"]]}, "meaning": "E1: each int2 window's card (key mean, deviation direction, per-token projections and value mean, written once at demotion) estimates the query's attention to it. Compared per query head with the true attention over the 26 int2 windows. The card is 34% of the 804 bytes/head it summarises."}, {"id": "fill-calibration", "name": "Fill Calibration", "claim": "Skipped windows are credited, not dropped: the card's fill is within 2x of truth for 88% of them", "chart": {"type": "tiles", "tiles": [{"value": "87.6%", "label": "skipped windows filled within 2x of truth"}, {"value": "27%", "label": "median fill error per window"}, {"value": "2.9%", "label": "attention reached through the fill, not lost"}]}, "table": {"cols": ["measure", "value"], "rows": [["read windows: cache mass vs truth (median)", "+3.5%"], ["skipped windows within 2x of truth", "87.6%"], ["skipped set in total vs truth", "-8%"]]}, "meaning": "For int2 windows the gate does not open, the kernel credits the card's estimate (the fill) to the score and to the output through the window's value centroid. Compared with the true attention of the same query (windows carrying >0.1% of attention)."}, {"id": "promotion-payload", "name": "Promotion Payload", "claim": "Promoting a dequantized window costs 0.004 output error, so no fp16 shadow is needed", "chart": {"type": "hbar", "unit": "", "digits": 3, "bars": [{"label": "promotion payload (dequantized -> fp16)", "value": 0.004, "kind": "ours"}, {"label": "read gate + fused kernel", "value": 0.054, "kind": "base"}, {"label": "int2 storage", "value": 0.068, "kind": "base"}, {"label": "eviction (the budget itself)", "value": 0.182, "kind": "base"}]}, "table": {"cols": ["measure", "value"], "rows": [["fp windows holding a promoted payload", "15.7%"], [ // ---- saving: the viewer's save prompt when hosted, a plain download when opened as a file
const statusEl = document.getElementById('status');
const say = msg => { statusEl.textContent = msg; };
const hosted = !!(window.claude && typeof window.claude.use === 'function');
let DL;   // undefined until asked; null when this view cannot save files
if (hosted) window.claude.use('downloads').then(d => { DL = d; if (!d) document.querySelectorAll('.export').forEach(b => { b.hidden = true; }); },
  () => { DL = null; });
async function saveFile(filename, blob) {
  if (hosted) {
    const d = DL === undefined ? await window.claude.use('downloads') : DL;
    if (!d) { say('Saving files is not available in this view.'); return false; }
    try { await d.save({ filename, data: blob }); say('Saved ' + filename); return true; }
    catch (e) {
      const c = e && e.code;
      say(c === 'declined' ? 'Save cancelled.' : c === 'rate_limited' ? 'A save prompt is already open; try again in a moment.'
        : 'Could not save the file (' + (c || 'error') + ').');
      return false;
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  say('Saved ' + filename); return true;
}
const toBlob = cv => new Promise(r => cv.toBlob(r, 'image/png'));
async function exportCard(entry) { return saveFile(`recoverkv-${entry.card.id}.png`, await toBlob(composeCard(entry))); }

// a stored (uncompressed) ZIP: PNGs are already compressed
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, crc, true); h.setUint32(18, n, true); h.setUint32(22, n, true); h.setUint16(26, name.length, true);
    parts.push(h, name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, n, true); c.setUint32(24, n, true); c.setUint16(28, name.length, true);
    c.setUint32(42, off, true);
    central.push(c, name);
    off += 30 + name.length + n;

  const cd = central.reduce((a, p) => a + p.byteLength, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cd, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, e], { type: 'application/zip' });
}
async function exportAllZip() {
  say(`Rendering ${CARDS.length} images...`);
  const files = [];
  for (const e of CARDS) files.push({ name: `recoverkv-${e.card.id}.png`,
    data: new Uint8Array(await (await toBlob(composeCard(e))).arrayBuffer()) });
  return zipStore(files);
}
document.getElementById('exportAll').addEventListener('click', async () => {
  saveFile('recoverkv-observations-png.zip', await exportAllZip());
});

// ---- theme -------------------------------------------------------------------
const modes = ['auto', 'light', 'dark']; let mode = 0;
try { const m = localStorage.getItem('rkv-theme'); if (m && modes.includes(m)) mode = modes.indexOf(m); } catch (e) {}
function applyTheme() {
  const m = modes[mode]; if (m === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = m;
  document.getElementById('theme').textContent = 'Theme: ' + m; renderAll();
}
document.getElementById('theme').addEventListener('click', () => { mode = (mode + 1) % 3;
  try { localStorage.setItem('rkv-theme', modes[mode]); } catch (e) {} applyTheme(); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderAll, 120); });

build(); applyTheme();
window.__RKV = { CARDS, composeCard, exportAllZip };
